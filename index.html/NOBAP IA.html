<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis // Nobap Intelligence</title>
    <style>
        /* --- FUTURISTIC CORE VARIABLES (Nobap Premium) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        :root {
            --bg-deep: #08080c;        
            --bg-sidebar: #040406;     
            --nobap-purple: #9b59b6;   
            --nobap-glow: rgba(155, 89, 182, 0.6);
            --text-pure: #ffffff;
            --text-muted: #828292;
            --border-glass: rgba(155, 89, 182, 0.15);
        }

        body {
            display: flex;
            background-color: var(--bg-deep);
            color: var(--text-pure);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* --- SIDEBAR PREMIUM --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            text-align: center;
            color: var(--text-pure);
            text-transform: uppercase;
        }

        .brand span {
            color: var(--nobap-purple);
            text-shadow: 0 0 10px var(--nobap-glow);
        }

        .new-chat-btn {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.1), transparent);
            color: var(--text-pure);
            border: 1px solid var(--nobap-purple);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: var(--nobap-purple);
            box-shadow: 0 0 20px var(--nobap-glow);
            transform: translateY(-1px);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
        }

        /* --- CHAT INTERFACE --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            position: relative;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 24px 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .message-wrapper.assistant {
            background-color: rgba(19, 19, 28, 0.4);
            border-top: 1px solid rgba(155, 89, 182, 0.05);
            border-bottom: 1px solid rgba(155, 89, 182, 0.05);
        }

        .message-content {
            max-width: 768px;
            width: 100%;
            font-size: 16px;
            line-height: 1.62;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-wrapper.user .message-content::before {
            content: "Você";
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message-wrapper.assistant .message-content::before {
            content: "Jarvis // Nobap AI";
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: var(--nobap-purple);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(155, 89, 182, 0.3);
        }

        /* --- FUTURISTIC INPUT BAR WITH AUDIO --- */
        .input-container-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            background: linear-gradient(transparent, var(--bg-deep) 40%);
        }

        .input-container {
            max-width: 768px;
            width: 100%;
            background-color: rgba(15, 15, 22, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 14px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-container:focus-within {
            border-color: var(--nobap-purple);
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.15), 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-pure);
            resize: none;
            outline: none;
            font-size: 16px;
            max-height: 200px;
            height: 24px;
            line-height: 24px;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        /* BOTÃO DE MICROFONE */
        .audio-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 5px;
            position: relative;
        }

        .audio-btn:hover {
            color: var(--nobap-purple);
        }

        /* Animação quando o microfone está gravando */
        .audio-btn.recording {
            color: #ff3366;
            animation: pulseRecord 1.5s infinite ease-in-out;
        }

        #send-btn {
            background: var(--text-pure);
            border: none;
            color: var(--bg-deep);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 10px;
        }

        #send-btn:hover {
            background: var(--nobap-purple);
            color: var(--text-pure);
            box-shadow: 0 0 15px var(--nobap-glow);
            transform: scale(1.05);
        }

        /* --- JARVIS PULSE EFFECT --- */
        .jarvis-pulse {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            margin-top: 5px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--nobap-purple);
            border-radius: 50%;
            animation: pulseGlow 1.2s infinite ease-in-out;
            box-shadow: 0 0 8px var(--nobap-purple);
        }

        .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
        .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @keyframes pulseRecord {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; text-shadow: 0 0 10px #ff3366; }
        }
    </style>
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <div class="brand">Nobap<span>_</span></div>
        <button class="new-chat-btn" onclick="clearChat()">+ Novo Registro</button>
        <div class="history-list"></div>
    </aside>

    <main class="chat-area">
        <div class="messages-container" id="chat-box">
            <div class="message-wrapper assistant">
                <div class="message-content">Sistemas integrados. Protocolo de voz disponível. O que você precisa, comandante?</div>
            </div>
        </div>
        
        <div class="input-container-wrapper">
            <div class="input-container">
                <textarea id="user-input" placeholder="Fale ou digite um comando..." rows="1"></textarea>
                <!-- Ícone Unicode de Microfone 🎙 -->
                <button class="audio-btn" id="audio-btn" onclick="toggleSpeech()">🎙</button>
                <button id="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </main>
</div>

<script>
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const audioBtn = document.getElementById('audio-btn');

    let recognition;
    let isRecording = false;

    // Configurando reconhecimento de áudio nativo do navegador
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            audioBtn.classList.add('recording');
            userInput.placeholder = "[ Escutando... Fale agora ]";
        };

        recognition.onend = () => {
            isRecording = false;
            audioBtn.classList.remove('recording');
            userInput.placeholder = "Fale ou digite um comando...";
        };

        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript;
            userInput.value = speechToText;
            userInput.style.height = userInput.scrollHeight + 'px';
            sendMessage(); // Envia automaticamente após você terminar de falar
        };

        recognition.onerror = (event) => {
            console.error("Erro no reconhecimento de voz: ", event.error);
        };
    } else {
        audioBtn.style.display = 'none'; // Esconde o botão se o navegador não der suporte
        console.log("Seu navegador não suporta reconhecimento de voz.");
    }

    function toggleSpeech() {
        if (!recognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    // Função de Síntese de Voz (Fazer o Jarvis falar)
    function jarvisSpeak(text) {
        if ('speechSynthesis' in window) {
            // Cancela qualquer fala que esteja rolando antes
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1;  // Velocidade levemente acelerada para parecer mais tecnológico
            utterance.pitch = 0.95; // Tom de voz um pouquinho mais encorpado/masculino estilo Jarvis
            
            window.speechSynthesis.speak(utterance);
        }
    }

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
        if (this.value === '') this.style.height = '24px';
    });

    userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function appendMessage(text, sender) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${sender}`;
        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = text;
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
        return content;
    }

    function typeEffect(element, text, speed = 15) {
        element.textContent = "";
        let i = 0;
        function type() {
            if (i < text.length) {
                element.textContent += text.charAt(i);
                i++;
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(type, speed);
            }
        }
        type();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';
        userInput.style.height = '24px';

        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper assistant';
        const content = document.createElement('div');
        content.className = 'message-content';
        content.innerHTML = `
            <div class="jarvis-pulse">
                <div class="pulse-dot"></div>
                <div class="pulse-dot"></div>
                <div class="pulse-dot"></div>
            </div>
        `;
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
const token = localStorage.getItem('CHAT_TOKEN') || '';

            const response = await fetch("/api/chat-secure", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    ...(token ? { "Authorization": `Bearer ${token}` } : {})
                },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const rawResponse = data.choices[0].message.content.trim();
                
                // 1. Inicia o efeito visual de digitação
                typeEffect(content, rawResponse);
                
                // 2. Aciona o áudio para o Jarvis falar a resposta junto!
                jarvisSpeak(rawResponse);
            } else {
                content.textContent = "Erro de decodificação na resposta do Jarvis.";
            }
        } catch (error) {
            console.error(error);
            content.textContent = "Falha de link com a matriz de processamento.";
        }
    }

    function clearChat() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        chatBox.innerHTML = `
            <div class="message-wrapper assistant">
                <div class="message-content">Sistemas sincronizados. Canal limpo para nova operação.</div>
            </div>
        `;
    }
</script>
</body>
</html>
