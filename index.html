<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis // Nobap Intelligence</title>
    <style>

        /* --- FUTURISTIC CORE VARIABLES (Nobap Premium) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
        }

        :root {
            /* ChatGPT-like neutrals */
            --bg: #0b0b0f;
            --panel: #12121a;
            --panel-2: #1a1a26;
            --text: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.6);
            --border: rgba(255,255,255,0.08);
            --border-2: rgba(255,255,255,0.12);

            --chat-bg: #0b0b0f;
            --bubble-user: rgba(124, 58, 237, 0.18);
            --bubble-assistant: rgba(255,255,255,0.06);
            --bubble-user-border: rgba(124, 58, 237, 0.35);
            --bubble-assistant-border: rgba(255,255,255,0.12);

            --input-bg: rgba(18,18,26,0.65);
            --input-border: rgba(255,255,255,0.12);
            --shadow: 0 10px 30px rgba(0,0,0,0.35);

            --primary: #a78bfa;
            --primary-2: #8b5cf6;
        }

        body.theme-light {
            --bg: #f5f6fb;
            --panel: #ffffff;
            --panel-2: #f3f4f6;
            --text: rgba(13, 16, 26, 0.92);
            --muted: rgba(13, 16, 26, 0.55);
            --border: rgba(13,16,26,0.08);
            --border-2: rgba(13,16,26,0.12);

            --chat-bg: #f5f6fb;
            --bubble-user: rgba(124, 58, 237, 0.14);
            --bubble-assistant: rgba(13,16,26,0.04);
            --bubble-user-border: rgba(124, 58, 237, 0.28);
            --bubble-assistant-border: rgba(13,16,26,0.12);

            --input-bg: rgba(255,255,255,0.78);
            --input-border: rgba(13,16,26,0.12);
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body {
            display: flex;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        .auth-card {
            max-height: 90vh;
            overflow: auto;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .sidebar-toggle {
                left: 10px;
                top: 10px;
                padding: 10px 10px;
            }

            /* sidebar vira overlay */
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 2000;
                background: var(--bg-sidebar);
                border-right: 1px solid var(--border-glass);
                width: 260px;
                transition: transform 0.25s ease;
                transform: translateX(-100%);
                padding: 25px 15px;
                overflow: hidden;
            }

            #sidebar.open {
                transform: translateX(0);
                border-right: 1px solid var(--border-glass);
                width: 260px;
            }

            #app-shell.container {
                height: 100vh;
            }
        }


        /* --- AUTH GATE + SHELL --- */
        .auth-gate {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, rgba(155, 89, 182, 0.18), transparent 40%),
                        rgba(8, 8, 12, 0.92);
            z-index: 9999;
        }

        .auth-card {
            width: min(520px, 92vw);
            padding: 22px 20px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: rgba(18, 18, 26, 0.88);
            box-shadow: var(--shadow);
        }

        body.theme-light .auth-card {
            background: rgba(255,255,255,0.9);
        }

        .auth-brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
        }
        .auth-brand span { color: var(--nobap-purple); text-shadow: 0 0 12px var(--nobap-glow); }

        .auth-title {
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            margin-top: 6px;
        }

        .auth-sub {
            margin-top: 8px;
            text-align: center;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .auth-login-btn {
            width: 100%;
            margin-top: 18px;
            border: 1px solid rgba(155, 89, 182, 0.55);
            background: rgba(155, 89, 182, 0.12);
            color: white;
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .auth-login-btn:hover {
            background: var(--nobap-purple);
            color: #0b0b10;
            box-shadow: 0 0 18px var(--nobap-glow);
            transform: translateY(-1px);
        }

        .auth-error {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 51, 102, 0.45);
            background: rgba(255, 51, 102, 0.08);
            color: #ffb3c2;
            font-weight: 700;
            font-size: 13px;
        }

        /* --- Sidebar toggle behavior --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-glass);
            position: relative;
        }

        #sidebar {
            width: 0;
            padding: 0;
            border-right: none;
            transition: width 0.25s ease;
            overflow: hidden;
        }

        #sidebar.open {
            width: 260px;
            padding: 25px 15px;
            border-right: 1px solid var(--border-glass);
        }

        .sidebar-toggle {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 1000;
            border: 1px solid var(--border);
            background: rgba(18,18,26,0.85);
            color: var(--text);
            border-radius: 14px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        body.theme-light .sidebar-toggle {
            background: rgba(255,255,255,0.9);
        }

        .sidebar-toggle-underscore { color: var(--nobap-purple); text-shadow: 0 0 12px var(--nobap-glow); }

        #sidebar-toggle { visibility: hidden; }

        .container {

            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* --- SIDEBAR (ChatGPT-like) --- */
        .sidebar {
            width: 260px;
            background-color: var(--panel);
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-right: 1px solid var(--border);
        }

        .brand {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-align: left;
            color: var(--text);
            text-transform: none;
            opacity: 0.95;
        }

        .brand span {
            color: var(--primary);
            text-shadow: none;
        }

        .menu-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .new-chat-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .new-chat-btn:hover {
            background: rgba(167,139,250,0.12);
            border-color: rgba(167,139,250,0.35);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
        }

        .history-list button {
            backdrop-filter: blur(8px);
        }

        /* --- CHAT INTERFACE (ChatGPT-like) --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            position: relative;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px 0 0 0;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper {
            width: 100%;
            display: flex;
            padding: 8px 20px;
            animation: fadeIn 0.25s ease-out;
        }

        .message-wrapper.assistant {
            justify-content: flex-start;
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 760px;
            width: 100%;
            font-size: 14.5px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;

            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            box-shadow: none;
        }

        .message-wrapper.user .message-content {
            background: var(--bubble-user);
            border-color: var(--bubble-user-border);
        }

        .message-wrapper.assistant .message-content {
            background: var(--bubble-assistant);
            border-color: var(--bubble-assistant-border);
        }

        /* Remove labels (ChatGPT não mostra "Você"/nome como pseudo-elemento) */
        .message-wrapper.user .message-content::before,
        .message-wrapper.assistant .message-content::before {
            content: none !important;
        }

        /* --- INPUT (ChatGPT-like) --- */
        .input-container-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 20px 26px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 0%, var(--bg) 30%);
        }

        .input-container {
            max-width: 760px;
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            display: flex;
            align-items: flex-end;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            gap: 10px;
        }

        .input-container:focus-within {
            border-color: rgba(167,139,250,0.65);
            box-shadow: 0 0 0 3px rgba(167,139,250,0.18), var(--shadow);
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            resize: none;
            outline: none;
            font-size: 14.5px;
            max-height: 160px;
            height: 24px;
            line-height: 20px;
            padding: 6px 0;
        }

        #user-input::placeholder {
            color: var(--muted);
        }

        /* BOTÃO DE MICROFONE (keep functionality, make it ChatGPT-like) */
        .audio-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            width: 34px;
            height: 34px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            margin-left: 0;
        }

        .audio-btn:hover {
            background: rgba(167,139,250,0.12);
            border-color: rgba(167,139,250,0.28);
            color: var(--text);
        }

        /* Animação quando o microfone está gravando */
        .audio-btn.recording {
            color: #ff5c7a;
            animation: pulseRecord 1.5s infinite ease-in-out;
        }

        #send-btn {
            background: var(--primary);
            border: none;
            color: rgba(0,0,0,0.85);
            width: 38px;
            height: 38px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
        }

        #send-btn:hover {
            filter: brightness(1.04);
            transform: scale(1.03);
        }

        #send-btn:active {
            transform: scale(0.98);
        }

        /* --- JARVIS PULSE EFFECT --- */
        .jarvis-pulse {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }

        /* “Carregando” estilo WhatsApp (bolinhas) */
        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 2px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--chat-assistant-bd);
            opacity: 0.55;
            animation: typingBounce 0.9s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.12s; }
        .typing-dot:nth-child(3) { animation-delay: 0.24s; }

        @keyframes typingBounce {
            0%, 100% { transform: translateY(0); opacity: 0.45; }
            50% { transform: translateY(-4px); opacity: 0.95; }
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--nobap-purple);
            border-radius: 50%;
            animation: pulseGlow 1.2s infinite ease-in-out;
            box-shadow: 0 0 8px var(--nobap-purple);
        }

        .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
        .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @keyframes pulseRecord {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; text-shadow: 0 0 10px #ff3366; }
        }
    </style>
</head>
<body>

<!-- AUTH GATE (antes do login) -->
<div id="auth-gate" class="auth-gate">
    <div class="auth-card">
        <div class="auth-brand">Nobap<span>_</span></div>
        <div class="auth-title">Acesso restrito</div>
        <div class="auth-sub">Faça login com Google para entrar na IA.</div>

        <button id="login-google-btn" class="auth-login-btn">Login com Google</button>
        <div id="auth-error" class="auth-error" style="display:none;"></div>

        <div class="auth-hint">Ao entrar, seu chat ficará disponível neste dispositivo.</div>
    </div>
</div>

<!-- APP SHELL (após login) -->
<div id="app-shell" class="container" style="display:none;">
    <aside class="sidebar" id="sidebar">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Abrir/Fechar Nobap" type="button">
            <span class="sidebar-toggle-text">Nobap</span><span class="sidebar-toggle-underscore">_</span>
        </button>

        <div class="sidebar-inner" style="display:flex;flex-direction:column;gap:18px; padding-top:54px;">
            <div class="brand" style="margin-top:8px;">Nobap<span>_</span></div>

            <div class="menu-actions">
                <button class="new-chat-btn" onclick="startNewConversation()">+ Nova conversa</button>
            </div>

            <div class="history-list"></div>

            <div class="config-block">
                <div class="config-row">
                    <div class="account-pill" id="account-pill" style="padding:10px 12px;border-radius:14px;border:1px solid rgba(155,89,182,0.25);background:rgba(155,89,182,0.08);margin-bottom:10px;">
                        <div style="font-weight:900;letter-spacing:0.3px;">Conta</div>
                        <div id="account-email" style="color:rgba(255,255,255,0.85);font-size:13px;margin-top:6px;word-break:break-word;">—</div>
                    </div>
                </div>

                <div style="display:flex;gap:10px;">
                    <button id="logout-btn" style="flex:1;background:rgba(155, 89, 182, 0.12);border:1px solid rgba(155, 89, 182, 0.45);color:white;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;display:none;" type="button">Sair</button>
                </div>

                <div style="display:flex;gap:10px; margin-top:10px;">
                    <button id="terms-btn" style="flex:1;background:transparent;border:1px solid rgba(155, 89, 182, 0.35);color:white;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;" type="button">Termos de uso</button>
                    <button id="support-btn" style="flex:1;background:transparent;border:1px solid rgba(155, 89, 182, 0.35);color:white;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;" type="button">Suporte</button>
                </div>

                <div style="display:flex;gap:10px; margin-top:10px;">
                    <button id="theme-toggle-btn" style="flex:1;background:rgba(155, 89, 182, 0.12);border:1px solid rgba(155, 89, 182, 0.45);color:white;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;" type="button">Tema: Escuro</button>
                </div>

                <div class="divider" style="height:1px;background:rgba(155,89,182,0.22);margin:14px 0;"></div>

                <div style="color:rgba(255,255,255,0.75);font-size:12px;line-height:1.4;">
                    Preferências salvas localmente.
                </div>
            </div>
        </div>
    </aside>


    <main class="chat-area">
        <div class="messages-container" id="chat-box">
            <div class="message-wrapper assistant">
                <div class="message-content">Sistemas integrados. Protocolo de voz disponível. O que você precisa, comandante?</div>
            </div>
        </div>
        
        <div class="input-container-wrapper">
            <div class="input-container">
                <textarea id="user-input" placeholder="Fale ou digite um comando..." rows="1"></textarea>
                <!-- Ícone Unicode de Microfone 🎙 -->
                <button class="audio-btn" id="audio-btn" onclick="toggleSpeech()">🎙</button>
                <button id="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </main>
</div>

<script>

    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const audioBtn = document.getElementById('audio-btn');
    const historyList = document.querySelector('.history-list');

    const STORAGE_KEY = 'nobap_jarvis_conversations_v1';
    const ACTIVE_KEY = 'nobap_jarvis_active_conversation_v1';

    const SUPABASE_URL = window.SUPABASE_URL || 'https://azbjozekbvvbwsksnohx.supabase.co';
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6YmpvemVrYnZ2Yndza3Nub2h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MjI3MTUsImV4cCI6MjA5NjM5ODcxNX0.2skfHWUyI6Y7pumENMvvK1d1atqKmPEksDFDBHMhH4k';


    let supabase = null;

    async function initSupabase() {
        // Carrega o SDK sem usar `await` no top-level (evita erro em pages estáticas)
        const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
        const { createClient } = mod;

        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession: true }
            });
        }
    }



    async function getAccessToken() {
        if (!supabase) return null;
        const { data } = await supabase.auth.getSession();
        return data?.session?.access_token || null;
    }

    async function requireLoginOrThrow() {
        const token = await getAccessToken();
        if (!token) throw new Error('Not logged in');
        return token;
    }


    function uid() {
        return Math.random().toString(16).slice(2) + Date.now().toString(16);
    }

    function loadConversations() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    function saveConversations(conversations) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    }

    function loadActiveConversationId() {
        return localStorage.getItem(ACTIVE_KEY) || null;
    }

    function saveActiveConversationId(id) {
        localStorage.setItem(ACTIVE_KEY, id);
    }

    function getActiveConversation(conversations) {
        const activeId = loadActiveConversationId();
        return conversations.find(c => c.id === activeId) || null;
    }

    let conversations = loadConversations();

    if (!conversations.length) {
        // cria uma conversa inicial
        const firstId = uid();
        conversations = [
            {
                id: firstId,
                createdAt: Date.now(),
                messages: [
                    {
                        sender: 'assistant',
                        text: 'Sistemas integrados. Protocolo de voz disponível. O que você precisa, comandante?'
                    }
                ]
            }
        ];
        saveConversations(conversations);
        saveActiveConversationId(firstId);
    } else if (!loadActiveConversationId() || !conversations.some(c => c.id === loadActiveConversationId())) {
        saveActiveConversationId(conversations[0].id);
    }

    let activeConversationId = loadActiveConversationId();

    function setActiveConversation(id) {
        activeConversationId = id;
        saveActiveConversationId(id);
        render();
    }

    function getActiveConversationObj() {
        return conversations.find(c => c.id === activeConversationId) || null;
    }

    function persistActiveConversation(messages) {
        const idx = conversations.findIndex(c => c.id === activeConversationId);
        if (idx === -1) return;
        conversations[idx].messages = messages;
        saveConversations(conversations);
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '<')
            .replaceAll('>', '>')
            .replaceAll('"', '"')
            .replaceAll("'", '&#039;');
    }

    function formatHistoryLabel(messages) {
        const firstUser = messages.find(m => m.sender === 'user' && m.text && m.text.trim());
        if (firstUser) return firstUser.text.trim().slice(0, 28) + (firstUser.text.trim().length > 28 ? '…' : '');
        return 'Nova conversa';
    }

    function renderHistory() {
        if (!historyList) return;
        historyList.innerHTML = '';

        // mais recente no topo
        const sorted = [...conversations].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        for (const conv of sorted) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.style.width = '100%';
            btn.style.textAlign = 'left';
            btn.style.background = 'transparent';
            btn.style.border = '1px solid rgba(155, 89, 182, 0.15)';
            btn.style.borderRadius = '12px';
            btn.style.padding = '10px 12px';
            btn.style.color = 'white';
            btn.style.marginBottom = '10px';
            btn.style.cursor = 'pointer';
            btn.style.fontWeight = '600';
            btn.style.letterSpacing = '0.2px';
            btn.style.opacity = conv.id === activeConversationId ? '1' : '0.75';
            btn.style.boxShadow = conv.id === activeConversationId ? '0 0 20px rgba(155, 89, 182, 0.25)' : 'none';

            btn.innerHTML = `
                ${escapeHtml(formatHistoryLabel(conv.messages || []))}
            `;

            btn.onclick = () => setActiveConversation(conv.id);
            historyList.appendChild(btn);
        }
    }

    function renderMessages() {
        const conv = getActiveConversationObj();
        chatBox.innerHTML = '';

        if (!conv || !conv.messages || !conv.messages.length) {
            // fallback (não deve acontecer)
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper assistant';
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = 'Sistemas sincronizados.';
            wrapper.appendChild(content);
            chatBox.appendChild(wrapper);
            return;
        }

        for (const m of conv.messages) {
            const sender = m.sender === 'user' ? 'user' : 'assistant';
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = m.text || '';

            wrapper.appendChild(content);
            chatBox.appendChild(wrapper);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function render() {
        renderHistory();
        renderMessages();
    }


    let recognition;
    let isRecording = false;

    // Configurando reconhecimento de áudio nativo do navegador
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            audioBtn.classList.add('recording');
            userInput.placeholder = "[ Escutando... Fale agora ]";
        };

        recognition.onend = () => {
            isRecording = false;
            audioBtn.classList.remove('recording');
            userInput.placeholder = "Fale ou digite um comando...";
        };

        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript;
            userInput.value = speechToText;
            userInput.style.height = userInput.scrollHeight + 'px';
            sendMessage(); // Envia automaticamente após você terminar de falar
        };

        recognition.onerror = (event) => {
            console.error("Erro no reconhecimento de voz: ", event.error);
            isRecording = false;
            audioBtn.classList.remove('recording');
        };
    } else {
        audioBtn.style.display = 'none'; // Esconde o botão se o navegador não der suporte
        console.log("Seu navegador não suporta reconhecimento de voz.");
    }

    function toggleSpeech() {
        if (!recognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    // Função de Síntese de Voz (Fazer o Jarvis falar)
    function jarvisSpeak(text) {
        if ('speechSynthesis' in window) {
            // Cancela qualquer fala que esteja rolando antes
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1;  // Velocidade levemente acelerada para parecer mais tecnológico
            utterance.pitch = 0.95; // Tom de voz um pouquinho mais encorpado/masculino estilo Jarvis
            
            window.speechSynthesis.speak(utterance);
        }
    }

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
        if (this.value === '') this.style.height = '24px';
    });

    userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    const loginGoogleBtn = document.getElementById('login-google-btn');

    const logoutBtn = document.getElementById('logout-btn');

    if (loginGoogleBtn) {
        loginGoogleBtn.addEventListener('click', async () => {
            try {
                console.log('[OAuth] Clique login Google. supabase=', !!supabase, 'url=', window.location.href);
                if (!supabase) {
                    alert('Supabase não inicializado (supabase=null).');
                    return;
                }

                // Força redirect para bater exatamente com o OAuth configurado no Google.
                // Use seu domínio público (Vercel) sem depender do origin/path do Supabase.
                const redirectTo = 'https://nobap-ia.vercel.app/';


                alert('Iniciando Login Google...\nRedirectTo: ' + redirectTo);

                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo,
                        // recomendado para SPA
                        flowType: 'pkce'
                    }
                });

                if (error) {
                    console.error('[OAuth] error:', error);
                    alert('Login Google falhou: ' + (error.message || JSON.stringify(error)));
                    return;
                }

                console.log('[OAuth] iniciado:', data);
            } catch (e) {
                console.error('[OAuth] exception:', e);
                alert('Erro inesperado no Login Google: ' + (e?.message || String(e)));
            }
        });
    }


    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            if (!supabase) return;
            await supabase.auth.signOut();
            render();
        });
    }

    async function syncAuthUI() {
        if (!supabase) return;
        const { data } = await supabase.auth.getSession();
        const loggedIn = !!data?.session;

        // alterna tela de login vs app
        const authGate = document.getElementById('auth-gate');
        const appShell = document.getElementById('app-shell');
        if (authGate) authGate.style.display = loggedIn ? 'none' : 'flex';
        if (appShell) appShell.style.display = loggedIn ? 'block' : 'none';

        if (logoutBtn) logoutBtn.style.display = loggedIn ? 'block' : 'none';
        if (loginGoogleBtn) loginGoogleBtn.style.display = loggedIn ? 'none' : 'block';

        // força render do chat quando entrar
        if (loggedIn) {
            try {
                render();
                // abre sidebar no primeiro acesso (opcional)
                const sidebar = document.getElementById('sidebar');
                const toggle = document.getElementById('sidebar-toggle');
                if (sidebar && toggle && !sidebar.classList.contains('open')) {
                    // deixa recolhida inicialmente; não abrir automaticamente
                }
            } catch (_) {}
        }
    }


    // Tema
    const THEME_KEY = 'nobap_jarvis_theme_v1';
    const themeToggleBtn = document.getElementById('theme-toggle-btn');

    function applyTheme(theme) {
        const isLight = theme === 'light';
        document.body.classList.toggle('theme-light', isLight);
        if (themeToggleBtn) themeToggleBtn.textContent = `Tema: ${isLight ? 'Claro' : 'Escuro'}`;
        try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
    }

    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
            const current = document.body.classList.contains('theme-light') ? 'light' : 'dark';
            applyTheme(current === 'light' ? 'dark' : 'light');
        });
    }

    // carrega tema salvo
    try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') applyTheme(saved);
        else applyTheme('dark');
    } catch (_) {
        applyTheme('dark');
    }

    // init supabase depois que o script carregar
    initSupabase().then(() => {
        if (supabase) {
            supabase.auth.onAuthStateChange(() => syncAuthUI());
            syncAuthUI();
        }
    }).catch((e) => {
        console.error('[Supabase] init error:', e);
    });




    function appendMessage(text, sender) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${sender}`;
        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = text;
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
        return content;
    }

    function typeEffect(element, text, speed = 15, onDone) {
        element.textContent = "";
        let i = 0;
        function type() {
            if (i < text.length) {
                element.textContent += text.charAt(i);
                i++;
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(type, speed);
            } else {
                if (typeof onDone === 'function') onDone();
            }
        }
        type();
    }


    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Para o endpoint /api/chat, o backend valida token via Supabase admin.
        // Se o usuário não estiver logado, mostra erro e não “some” a mensagem.
        const accessToken = await requireLoginOrThrow();

        const conv = getActiveConversationObj();
        if (!conv) return;

        // atualiza local (cache) para não travar UI
        const nextMessagesAfterUser = [...(conv.messages || [])];
        nextMessagesAfterUser.push({ sender: 'user', text });
        persistActiveConversation(nextMessagesAfterUser);

        // grava no banco (se Supabase estiver configurado)
        if (conv.id && typeof accessToken === 'string' && accessToken) {
            await fetch('/api/conversations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                },
                body: JSON.stringify({
                    action: 'append',
                    conversationId: conv.id,
                    sender: 'user',
                    content: text
                })
            });
        }

        appendMessage(text, 'user');

        userInput.value = '';
        userInput.style.height = '24px';

        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper assistant';
        const content = document.createElement('div');
        content.className = 'message-content';
        content.innerHTML = `
            <div class="typing-bubble" aria-label="Carregando">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // /api/chat já pode funcionar sem Supabase (depende só do GROQ_API_KEY no servidor)
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${accessToken}`
                },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();


            const rawResponse = (data?.content ??
                data?.choices?.[0]?.message?.content ??
                data?.choices?.[0]?.text ??
                '').trim();

            if (rawResponse) {
            // 1. Inicia o efeito visual de digitação
                typeEffect(content, rawResponse, 15, () => {
                    const convNow = getActiveConversationObj();
                    const msgs = convNow ? convNow.messages || [] : [];
                    persistActiveConversation([...msgs, { sender: 'assistant', text: rawResponse }]);
                });

                // 2. Aciona o áudio para o Jarvis falar a resposta junto!
                jarvisSpeak(rawResponse);
            } else {
                console.error('Resposta inesperada:', data);
                content.textContent = "Erro ao decodificar a resposta do Jarvis.";
            }

        } catch (error) {
            console.error(error);
            content.textContent = "Falha de link com a matriz de processamento.";
        }
    }


    function startNewConversation() {
        // recria conversa local
        const firstId = uid();
        const nextConversations = [
            {
                id: firstId,
                createdAt: Date.now(),
                messages: [
                    {
                        sender: 'assistant',
                        text: 'Sistemas integrados. Protocolo de voz disponível. O que você precisa, comandante?'
                    }
                ]
            }
        ];
        conversations = nextConversations;
        activeConversationId = firstId;
        saveConversations(conversations);
        saveActiveConversationId(firstId);
        render();
        try {
            const sidebar = document.getElementById('sidebar');
            if (sidebar && sidebar.classList.contains('open')) {
                // mantém aberto
            }
        } catch (_) {}
    }

    function clearChat() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const convNow = getActiveConversationObj();
        if (!convNow) {
            startNewConversation();
            return;
        }
        const nextMessages = [
            {
                sender: 'assistant',
                text: 'Sistemas sincronizados. Canal limpo para nova operação.'
            }
        ];
        persistActiveConversation(nextMessages);
        render();
    }
</script>
</body>
</html>
